# xdg-desktop-portal backend preference for the wasp session.
#
# Installed as /etc/xdg-desktop-portal/wasp-portals.conf. Picked up
# because scripts/wasp-session exports XDG_CURRENT_DESKTOP=wasp, and
# xdg-desktop-portal looks for a $XDG_CURRENT_DESKTOP-portals.conf before
# falling back to the generic portals.conf (default=*, ambiguous backend
# selection -- it could just as easily pick a GNOME/KDE backend that
# isn't actually running).
#
# gtk covers FileChooser/Settings/Notification/Print generically, without
# needing a full desktop environment behind it -- same reasoning as
# spitfire's packaging/spitfire-portals.conf. gnome-keyring already runs
# here for Secret, so route that explicitly instead of leaving it to
# chance.
#
# wlr covers ScreenCast/Screenshot -- wasp implements wlr-screencopy and
# wlr_export_dmabuf_v1 (see wlr_screencopy_manager_v1_create() and
# wlr_export_dmabuf_manager_v1_create() in dwl.c), which is what
# xdg-desktop-portal-wlr needs on the compositor side. Not
# xdg-desktop-portal-hyprland -- that one talks to Hyprland's own IPC
# socket for window listing and won't work against a plain
# wlr-screencopy compositor like wasp.
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
